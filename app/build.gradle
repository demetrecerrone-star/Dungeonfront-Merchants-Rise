plugins { id 'com.android.application' }

def signPath = System.getenv('DUNGEONFRONT_KEYSTORE_PATH')
def signStorePass = System.getenv('DUNGEONFRONT_STORE_PASSWORD')
def signAlias = System.getenv('DUNGEONFRONT_KEY_ALIAS')
def signKeyPass = System.getenv('DUNGEONFRONT_KEY_PASSWORD')
def usePersistentSigning = [signPath, signStorePass, signAlias, signKeyPass].every { it != null && !it.trim().isEmpty() }

android {
 namespace 'com.dabski.dungeonfront'
 compileSdk 35
 defaultConfig {
  applicationId 'com.dabski.dungeonfront'
  minSdk 26
  targetSdk 35
  versionCode 9
  versionName '0.6'
 }
 signingConfigs {
  if (usePersistentSigning) {
   persistent {
    storeFile file(signPath)
    storePassword signStorePass
    keyAlias signAlias
    keyPassword signKeyPass
   }
  }
 }
 buildTypes {
  release {
   minifyEnabled false
   if (usePersistentSigning) signingConfig signingConfigs.persistent
  }
  debug { debuggable true }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 packaging { resources { excludes += ['META-INF/DEPENDENCIES','META-INF/NOTICE','META-INF/LICENSE'] } }
}
