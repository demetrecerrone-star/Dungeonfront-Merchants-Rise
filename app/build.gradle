plugins { id 'com.android.application' }
android {
 namespace 'com.dabski.dungeonfront'
 compileSdk 35
 defaultConfig {
  applicationId 'com.dabski.dungeonfront'
  minSdk 26
  targetSdk 35
  versionCode 2
  versionName '0.1.1'
 }
 buildTypes { release { minifyEnabled false }; debug { debuggable true } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 packaging { resources { excludes += ['META-INF/DEPENDENCIES','META-INF/NOTICE','META-INF/LICENSE'] } }
}
