name: Android landscape visual QA (no release)
on:
  workflow_dispatch:
  push:
    branches:
      - 'work/v0.8-roster-combat-treasure'
    paths:
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle'
      - '.github/workflows/android-visual-qa.yml'
permissions:
  contents: read
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify intact Dabski cinematic and unchanged save key
        run: |
          echo "075832e834948055122d81d901a30c97b3c898667f20e0935c5c664cd7af756d  app/src/main/assets/dabski_intro.mp4" | sha256sum --check
          grep -q 'dungeonfront_merchants_rise_save_v1' app/src/main/assets/game.js
      - name: Enable KVM acceleration
        run: |
          sudo chmod 666 /dev/kvm || true
      - name: Android emulator visual smoke tests, Galaxy S23 FE-style landscape
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb shell settings put system accelerometer_rotation 0
            adb shell wm size 1080x2340
            adb shell wm density 425
            adb shell wm size
            adb shell wm density
            set +e
            gradle --no-daemon :app:connectedDebugAndroidTest > android-emulator-qa.log 2>&1
            result=$?
            tail -n 90 android-emulator-qa.log
            mkdir -p qa-screenshots
            adb pull /sdcard/Android/data/com.dabski.dungeonfront/files/. qa-screenshots/ || true
            adb logcat -d -s DungeonfrontQA:I chromium:E WebViewFactory:E > qa-screenshots/emulator-logcat.txt || true
            adb shell wm size > qa-screenshots/display-size.txt || true
            adb shell wm density >> qa-screenshots/display-size.txt || true
            exit "$result"
      - name: Upload emulator screenshots, performance log and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dungeonfront-Android-Landscape-QA
          path: |
            qa-screenshots/
            android-emulator-qa.log
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 30
