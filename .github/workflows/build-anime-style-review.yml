name: Dungeonfront six-class anime style preview (NO APK)
on:
  workflow_dispatch:
  push:
    branches:
      - 'work/v0.9-anime-style-pass'
    paths:
      - 'tools/anime-style-details.js'
      - 'tools/generate_remaining_actor_art.js'
      - 'tools/build_anime_style_preview.py'
      - 'tools/pack_anime_illustrated_frames.py'
      - 'app/src/main/assets/illustrated-sprites.js'
      - 'app/src/main/assets/game.js'
      - 'app/src/main/assets/index.html'
      - 'tests/illustrated-sprites.test.js'
      - 'tests/modern-sprites.test.js'
      - 'tests/test_anime_frame_pack.py'
      - 'tools/import_illustrated_ranger_pose.py'
      - 'tests/test_illustrated_ranger_import.py'
      - 'app/src/main/assets/modern-knight-art.js'
      - 'tests/anime-style-polish.test.js'
      - '.github/workflows/build-anime-style-review.yml'

permissions:
  contents: read

jobs:
  style-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate six-class detail generator and safety invariants
        run: |
          node --check tools/anime-style-details.js
          node --check tools/generate_remaining_actor_art.js
          node --check app/src/main/assets/modern-knight-art.js
          node tests/anime-style-polish.test.js
          node --check app/src/main/assets/illustrated-sprites.js
          node tests/illustrated-sprites.test.js
          node tests/modern-sprites.test.js
          node tests/shop-ui.test.js
          node tests/remaining-actors-v2.test.js
          grep -q 'dungeonfront_merchants_rise_save_v1' app/src/main/assets/game.js
          grep -q 'versionCode 20' app/build.gradle
      - name: Install offline RGBA rasterizer and preview renderer
        run: |
          python3 -m pip install --quiet cairosvg pillow numpy opencv-python-headless
      - name: Validate original hand-painted source frame packing and alpha safety
        run: |
          python3 -m unittest discover -s tests -p test_anime_frame_pack.py -v
          python3 -m unittest discover -s tests -p test_illustrated_ranger_import.py -v
      - name: Generate 36 styled transparent PNG atlases and actual-size review
        run: |
          python3 tools/build_anime_style_preview.py
          test -s art-previews/anime-style-pass/six-class-styling-game-scale.png
          test -s art-previews/Dungeonfront-Anime-Style-Six-Class-Review.zip
      - name: Verify assets are review only
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('art-previews/anime-style-pass/manifest.json')
          d=json.loads(p.read_text())
          assert d['sheet_count']==36 and d['frame_count']==354, d
          assert d['status']=='REVIEW_ONLY_NOT_INSTALLED'
          for name in ('ranger','mage','cleric','rogue','mercenary'):
              assert not pathlib.Path(f'app/src/main/assets/sprites/actors_v2/{name}/idle.png').exists()
          print('PASS: 36 sheets, 354 frames; no new artwork enabled or shipped.')
          PY
      - name: Upload six-class style review
        uses: actions/upload-artifact@v4
        with:
          name: Dungeonfront-Six-Class-Anime-Polish-Review
          path: |
            art-previews/anime-style-pass/**
            art-previews/Dungeonfront-Anime-Style-Six-Class-Review.zip
          retention-days: 30
          if-no-files-found: error
