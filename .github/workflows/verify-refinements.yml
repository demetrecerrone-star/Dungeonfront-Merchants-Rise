name: Verify dungeon and contract refinements
on:
  push:
    branches:
      - 'work/contract-refinements-v0.7.1'
      - 'work/v0.8-roster-combat-treasure'
      - 'work/v0.9-shop-layout'
      - 'work/v0.9-character-art-v2'
    paths:
      - 'app/src/main/assets/**'
      - 'tests/**'
      - '.github/workflows/verify-refinements.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify generator scripts and browser JS syntax
        run: |
          python3 -m py_compile tools/generate_monster_art.py tools/generate_event_art.py
          node --check app/src/main/assets/sprite-system.js
          node --check app/src/main/assets/modern-sprites.js
          node --check app/src/main/assets/game.js
          node --check app/src/main/assets/dungeon.js
      - name: Run JavaScript regression suites — no Android APK build
        run: |
          node tests/economy.test.js
          node tests/dungeon.test.js
          node tests/dungeon-ui.test.js
          node tests/shop-ui.test.js
          node tests/raid.test.js
          node tests/encounters.test.js
          node tests/contracts.test.js
          node tests/v08.test.js
          node tests/sprites.test.js
          node tests/modern-sprites.test.js
          node tests/visual-combat.test.js
          node tests/events-art.test.js
      - name: Bundle 18 PNG sheets for art review (no APK)
        uses: actions/upload-artifact@v4
        with:
          name: Dungeonfront-18-Class-Sprite-Sheets
          path: app/src/main/assets/sprites/actors/**/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Bundle monster, boss and combat effect PNGs (no APK)
        uses: actions/upload-artifact@v4
        with:
          name: Dungeonfront-Monster-Boss-Effects-Sprites
          path: |
            app/src/main/assets/sprites/monsters/**/*.png
            app/src/main/assets/sprites/effects/*.png
            app/src/main/assets/sprites/manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Bundle animated dungeon events and guild icons (no APK)
        uses: actions/upload-artifact@v4
        with:
          name: Dungeonfront-Dungeon-Events-and-Guild-Icons
          path: |
            app/src/main/assets/sprites/events/**/*.png
            app/src/main/assets/sprites/ui/**/*.png
            app/src/main/assets/sprites/manifest.json
          if-no-files-found: error
          retention-days: 30
